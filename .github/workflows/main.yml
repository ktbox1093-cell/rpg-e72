name: Compilar Juego J2ME - Nokia E72

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar código del repositorio
      uses: actions/checkout@v4

    - name: Configurar Java JDK 8
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '8'

    - name: Compilar Clases J2ME con Stubs Oficiales
      run: |
        mkdir -p lib build dist
        
        # Descargar stubs ligeros y estables de J2ME desde un repositorio confiable
        curl -s -L -o lib/cldc.jar "https://raw.githubusercontent.com/svarzee/j2me-wireless-toolkit/master/lib/cldc_1.1.jar"
        curl -s -L -o lib/midp.jar "https://raw.githubusercontent.com/svarzee/j2me-wireless-toolkit/master/lib/midp_2.0.jar"

        # Compilar enlazando las librerías móviles
        javac -source 1.3 -target 1.3 \
              -bootclasspath "lib/cldc.jar:lib/midp.jar" \
              -d build src/*.java

    - name: Empaquetar en archivo .JAR
      run: |
        jar cfm dist/RPGE72.jar MANIFEST.MF -C build .

    - name: Subir el archivo JAR como artefacto descargable
      uses: actions/upload-artifact@v4
      with:
        name: RPGE72-Juego-NokiaE72
        path: dist/RPGE72.jar
