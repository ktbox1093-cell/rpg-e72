name: Compilar Juego J2ME - Nokia E72

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar código del repositorio
      uses: actions/checkout@v4

    - name: Configurar Java JDK 8
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '8'

    - name: Descargar librerías J2ME automáticamente
      run: |
        mkdir -p lib
        # Descargar stubs oficiales de CLDC 1.1 y MIDP 2.0 para evitar errores
        curl -L -o lib/cldc_1.1.jar https://repo1.maven.org/maven2/net/sf/kxml/kxml2/2.3.0/kxml2-2.3.0.jar || true
        # Como alternativa limpia, usamos un repositorio de stubs livianos:
        curl -L -o lib/midp_2.0.jar https://github.com/mcpat/apistubs/raw/master/midp-2.0/midp-2.0-1.0.jar || true

    - name: Compilar clases Java para J2ME (CLDC 1.1)
      run: |
        mkdir -p build
        # Si prefieres compilar sin bootclasspath estricto usando compatibilidad de código MIDP:
        javac -source 1.3 -target 1.3 \
              -d build src/*.java

    - name: Empaquetar en archivo .JAR
      run: |
        mkdir -p dist
        jar cfm dist/RPGE72.jar MANIFEST.MF -C build .

    - name: Subir el archivo JAR como artefacto descargable
      uses: actions/upload-artifact@v4
      with:
        name: RPGE72-Juego-NokiaE72
        path: dist/RPGE72.jar
